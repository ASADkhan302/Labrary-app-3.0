<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 447 447" width="447" height="447" fill="none">
  <defs>
    <!-- Purple Gradient for top rays -->
    <linearGradient id="purpleRayGrad" x1="223.5" y1="25" x2="223.5" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6A2290" />
      <stop offset="100%" stopColor="#43145B" />
    </linearGradient>

    <!-- Gold Gradient for Shield and Laurel -->
    <linearGradient id="crestGoldGrad" x1="100" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D4A02A" />
      <stop offset="50%" stopColor="#BC881B" />
      <stop offset="100%" stopColor="#9E7216" />
    </linearGradient>

    <!-- Top Text Arcs -->
    <path id="arcUniversity" d="M 68 250 A 175 175 0 0 1 110 95" />
    <path id="arcMarwat" d="M 337 95 A 175 175 0 0 1 379 250" />
    
    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.25" />
    </filter>
  </defs>

  <!-- ==================================================================== -->
  <!-- 1. TOP CREST: RISING SUN & RADIANT PURPLE RAYS                       -->
  <!-- ==================================================================== -->
  <g id="top-radiant-sun" filter="url(#softShadow)">
    <!-- 13 Purple Rays Radiating Upward -->
    <!-- Center ray -->
    <line x1="223.5" y1="80" x2="223.5" y2="28" stroke="#541A72" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="223.5" cy="25" r="2.5" fill="#541A72" />

    <!-- Left rays -->
    <line x1="215" y1="82" x2="204" y2="36" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="206" y1="85" x2="185" y2="46" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="198" y1="88" x2="167" y2="58" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="191" y1="91" x2="152" y2="74" stroke="#541A72" stroke-width="3.5" stroke-linecap="round" />
    <line x1="184" y1="95" x2="139" y2="92" stroke="#541A72" stroke-width="3.5" stroke-linecap="round" />

    <!-- Right rays -->
    <line x1="232" y1="82" x2="243" y2="36" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="241" y1="85" x2="262" y2="46" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="249" y1="88" x2="280" y2="58" stroke="#541A72" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="91" x2="295" y2="74" stroke="#541A72" stroke-width="3.5" stroke-linecap="round" />
    <line x1="263" y1="95" x2="308" y2="92" stroke="#541A72" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mountain Ridge Silhouette -->
    <path d="M 139 92 Q 170 82 205 91 Q 223.5 86 242 91 Q 277 82 308 92 L 314 96 L 133 96 Z" fill="#9E7216" />
    <path d="M 152 94 L 175 88 L 195 93 L 223.5 87 L 252 93 L 272 88 L 295 94 Z" stroke="#541A72" stroke-width="2" fill="none" />

    <!-- Concentric Sun Semi-Circle -->
    <path d="M 203 92 A 20.5 20.5 0 0 1 244 92 Z" fill="#FFFFFF" stroke="#9E7216" stroke-width="2.5" />
    <path d="M 209 92 A 14.5 14.5 0 0 1 238 92 Z" fill="#BC881B" opacity="0.3" />
    <!-- Sun rays within dome -->
    <line x1="223.5" y1="92" x2="223.5" y2="74" stroke="#9E7216" stroke-width="1.8" />
    <line x1="223.5" y1="92" x2="212" y2="77" stroke="#9E7216" stroke-width="1.8" />
    <line x1="223.5" y1="92" x2="235" y2="77" stroke="#9E7216" stroke-width="1.8" />
  </g>

  <!-- ==================================================================== -->
  <!-- 2. CENTRAL HERALDIC SHIELD                                           -->
  <!-- ==================================================================== -->
  <g id="heraldic-shield" filter="url(#softShadow)">
    <!-- Clip Path for the 4 shield quadrants -->
    <clipPath id="shieldShapeClip">
      <path d="M 114 91 Q 168 83 223.5 83 Q 279 83 333 91 Q 321 160 324 216 Q 324 285 223.5 352 Q 123 285 123 216 Q 126 160 114 91 Z" />
    </clipPath>

    <!-- Shield Background: 4 Quadrants -->
    <g clip-path="url(#shieldShapeClip)">
      <!-- Quadrant 1 (Top-Left): Gold -->
      <rect x="110" y="80" width="113.5" height="136" fill="#BC881B" />

      <!-- Quadrant 2 (Top-Right): Royal Purple -->
      <rect x="223.5" y="80" width="115" height="136" fill="#541A72" />

      <!-- Quadrant 3 (Bottom-Left): Royal Purple -->
      <rect x="110" y="216" width="113.5" height="145" fill="#541A72" />

      <!-- Quadrant 4 (Bottom-Right): Gold -->
      <rect x="223.5" y="216" width="115" height="145" fill="#BC881B" />

      <!-- Vertical Dividing Line -->
      <line x1="223.5" y1="80" x2="223.5" y2="355" stroke="#BC881B" stroke-width="3" />
      <!-- Horizontal Dividing Line -->
      <line x1="110" y1="216" x2="335" y2="216" stroke="#BC881B" stroke-width="3" />

      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <!-- QUADRANT 1 ICON: OPEN ACADEMIC BOOK (White)                        -->
      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <g id="icon-open-book" transform="translate(145, 132)">
        <!-- Left Page -->
        <path d="M 27 34 C 18 31, 8 32, 2 35 L 2 12 C 9 9, 18 8, 27 11 Z" fill="#FFFFFF" stroke="#3F1256" stroke-width="2" stroke-linejoin="round" />
        <path d="M 6 15 Q 16 12 24 14" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <path d="M 6 20 Q 16 17 24 19" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <path d="M 6 25 Q 16 22 24 24" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <!-- Right Page -->
        <path d="M 29 34 C 38 31, 48 32, 54 35 L 54 12 C 47 9, 38 8, 29 11 Z" fill="#FFFFFF" stroke="#3F1256" stroke-width="2" stroke-linejoin="round" />
        <path d="M 32 14 Q 40 12 50 15" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <path d="M 32 19 Q 40 17 50 20" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <path d="M 32 24 Q 40 22 50 25" stroke="#3F1256" stroke-width="1.2" fill="none" />
        <!-- Book Spine Center Fold -->
        <line x1="28" y1="11" x2="28" y2="35" stroke="#3F1256" stroke-width="2.5" />
      </g>

      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <!-- QUADRANT 2 ICON: CRESCENT MOON & 5-POINTED STAR (White)            -->
      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <g id="icon-crescent-star" transform="translate(243, 126)">
        <!-- Crescent Moon -->
        <path d="M 34 8 A 20 20 0 1 0 54 44 A 25 25 0 1 1 34 8 Z" fill="#FFFFFF" />
        <!-- 5-Pointed Star tilted towards upper right -->
        <polygon points="46,16 49,24 57,25 51,30 53,38 46,33 39,38 41,30 35,25 43,24" fill="#FFFFFF" />
      </g>

      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <!-- QUADRANT 3 ICON: DROMEDARY CAMEL (White)                           -->
      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <g id="icon-camel" transform="translate(139, 245)">
        <path d="M 12 36 
                 L 14 36 L 16 23 L 22 23 L 20 36 L 24 36 L 27 24 L 33 24 L 35 36 L 38 36 L 39 30 
                 C 42 28, 44 26, 44 21 
                 C 44 18, 42 16, 40 16 
                 C 38 10, 31 7, 27 12 
                 C 25 14, 22 15, 19 16 
                 L 15 13 C 13 10, 11 8, 8 7 
                 C 6 6, 4 5, 2 6 
                 C 1 7, 2 9, 4 10 
                 L 7 13 C 9 15, 11 18, 12 22 
                 L 11 36 Z" 
              fill="#FFFFFF" />
        <!-- Tail -->
        <path d="M 40 16 C 43 19, 44 23, 43 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <!-- QUADRANT 4 ICON: SCIENCE & TECH SEEDLING / CIRCUIT TREE (White)    -->
      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
      <g id="icon-circuit-tree" transform="translate(236, 238)">
        <!-- Base Ground Arc -->
        <path d="M 14 36 Q 30 32 46 36 L 44 38 Q 30 35 16 38 Z" fill="#FFFFFF" />
        <!-- Bottom Pair of Botanical Leaves -->
        <path d="M 30 32 C 22 30, 17 26, 17 22 C 23 21, 28 25, 30 32 Z" fill="#FFFFFF" />
        <path d="M 30 32 C 38 30, 43 26, 43 22 C 37 21, 32 25, 30 32 Z" fill="#FFFFFF" />
        <!-- Center Stem -->
        <line x1="30" y1="32" x2="30" y2="8" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Left Circuit Branch -->
        <line x1="30" y1="20" x2="23" y2="15" stroke="#FFFFFF" stroke-width="2" />
        <line x1="23" y1="15" x2="23" y2="10" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="23" cy="8" r="3" fill="#FFFFFF" />
        <circle cx="23" cy="8" r="1.5" fill="#BC881B" />
        <!-- Far Left Circuit Branch -->
        <line x1="25" y1="23" x2="18" y2="20" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="16" cy="19" r="2.5" fill="#FFFFFF" />
        <!-- Right Circuit Branch -->
        <line x1="30" y1="20" x2="37" y2="15" stroke="#FFFFFF" stroke-width="2" />
        <line x1="37" y1="15" x2="37" y2="10" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="37" cy="8" r="3" fill="#FFFFFF" />
        <circle cx="37" cy="8" r="1.5" fill="#BC881B" />
        <!-- Far Right Circuit Branch -->
        <line x1="35" y1="23" x2="42" y2="20" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="44" cy="19" r="2.5" fill="#FFFFFF" />
        <!-- Top Terminal Node -->
        <circle cx="30" cy="7" r="3.2" fill="#FFFFFF" />
        <circle cx="30" cy="7" r="1.6" fill="#BC881B" />
      </g>
    </g>

    <!-- Outer Golden Shield Rim Border -->
    <path d="M 114 91 Q 168 83 223.5 83 Q 279 83 333 91 Q 321 160 324 216 Q 324 285 223.5 352 Q 123 285 123 216 Q 126 160 114 91 Z" 
          fill="none" 
          stroke="url(#crestGoldGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" />
  </g>

  <!-- ==================================================================== -->
  <!-- 3. CURVED INSTITUTIONAL TEXT: "UNIVERSITY OF" & "LAKKI MARWAT"       -->
  <!-- ==================================================================== -->
  <g id="curved-institution-text" fill="#541A72" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-weight="900" font-size="21" letter-spacing="3.5">
    <text>
      <textPath href="#arcUniversity" startOffset="50%" text-anchor="middle">
        UNIVERSITY OF
      </textPath>
    </text>
    <text>
      <textPath href="#arcMarwat" startOffset="50%" text-anchor="middle">
        LAKKI MARWAT
      </textPath>
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- 4. GOLDEN LAUREL WREATH & FOUNDING YEAR 2017                         -->
  <!-- ==================================================================== -->
  <g id="laurel-wreath" fill="#BC881B" stroke="#9E7216" stroke-width="0.8" filter="url(#softShadow)">
    <!-- Left Laurel Branch (14 leaf pairs) -->
    <path d="M 68 128 C 62 120, 68 114, 76 118 C 76 124, 72 128, 68 128 Z" />
    <path d="M 62 144 C 54 136, 62 130, 70 134 C 70 140, 66 144, 62 144 Z" />
    <path d="M 58 162 C 48 155, 56 148, 64 152 C 65 158, 62 162, 58 162 Z" />
    <path d="M 56 182 C 46 176, 52 168, 62 172 C 62 178, 60 182, 56 182 Z" />
    <path d="M 56 202 C 45 198, 50 188, 60 192 C 61 198, 59 202, 56 202 Z" />
    <path d="M 58 222 C 46 220, 50 208, 60 212 C 61 218, 60 222, 58 222 Z" />
    <path d="M 62 242 C 50 242, 52 228, 63 232 C 64 238, 64 242, 62 242 Z" />
    <path d="M 69 262 C 56 264, 56 248, 68 251 C 70 258, 70 262, 69 262 Z" />
    <path d="M 78 281 C 65 285, 63 268, 76 270 C 78 277, 80 281, 78 281 Z" />
    <path d="M 90 299 C 76 305, 73 287, 86 288 C 89 295, 92 298, 90 299 Z" />
    <path d="M 104 316 C 90 324, 85 305, 99 304 C 103 311, 106 315, 104 316 Z" />
    <path d="M 122 331 C 108 340, 101 321, 115 319 C 120 326, 124 330, 122 331 Z" />
    <path d="M 143 343 C 128 353, 120 334, 134 330 C 140 337, 144 341, 143 343 Z" />
    <path d="M 166 352 C 151 363, 142 344, 156 339 C 162 346, 167 350, 166 352 Z" />

    <!-- Right Laurel Branch (14 leaf pairs) -->
    <path d="M 379 128 C 385 120, 379 114, 371 118 C 371 124, 375 128, 379 128 Z" />
    <path d="M 385 144 C 393 136, 385 130, 377 134 C 377 140, 381 144, 385 144 Z" />
    <path d="M 389 162 C 399 155, 391 148, 383 152 C 382 158, 385 162, 389 162 Z" />
    <path d="M 391 182 C 401 176, 395 168, 385 172 C 385 178, 387 182, 391 182 Z" />
    <path d="M 391 202 C 402 198, 397 188, 387 192 C 386 198, 388 202, 391 202 Z" />
    <path d="M 389 222 C 401 220, 397 208, 387 212 C 386 218, 387 222, 389 222 Z" />
    <path d="M 385 242 C 397 242, 395 228, 384 232 C 383 238, 383 242, 385 242 Z" />
    <path d="M 378 262 C 391 264, 391 248, 379 251 C 377 258, 377 262, 378 262 Z" />
    <path d="M 369 281 C 382 285, 384 268, 371 270 C 369 277, 367 281, 369 281 Z" />
    <path d="M 357 299 C 371 305, 374 287, 361 288 C 358 295, 355 298, 357 299 Z" />
    <path d="M 343 316 C 357 324, 362 305, 348 304 C 344 311, 341 315, 343 316 Z" />
    <path d="M 325 331 C 339 340, 346 321, 332 319 C 327 326, 323 330, 325 331 Z" />
    <path d="M 304 343 C 319 353, 327 334, 313 330 C 307 337, 303 341, 304 343 Z" />
    <path d="M 281 352 C 296 363, 305 344, 291 339 C 285 346, 280 350, 281 352 Z" />

    <!-- Stems Crossing at Bottom -->
    <path d="M 148 358 Q 223.5 425 264 420" stroke="#BC881B" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 299 358 Q 223.5 425 183 420" stroke="#BC881B" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Founding Year "2017" -->
    <text x="223.5" y="386" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="900" font-size="34" letter-spacing="3" fill="#BC881B" stroke="#9E7216" stroke-width="1.2">
      2017
    </text>
  </g>
</svg>